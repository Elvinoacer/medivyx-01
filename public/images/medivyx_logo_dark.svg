<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="medivyx-badge-dark" x1="6" y1="6" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="medivyx-glow-dark" x="0" y="2" width="60" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Badge -->
  <g filter="url(#medivyx-glow-dark)">
    <rect x="6" y="6" width="48" height="48" rx="14" fill="url(#medivyx-badge-dark)" />
    <rect x="6.5" y="6.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>

  <!-- Medical Cross & Pulse Center -->
  <rect x="26" y="15" width="8" height="30" rx="4" fill="#ffffff" />
  <rect x="15" y="26" width="30" height="8" rx="4" fill="#ffffff" />
  <circle cx="30" cy="30" r="4.5" fill="#065f46" />
  <circle cx="30" cy="30" r="2" fill="#6ee7b7" />

  <!-- Typography -->
  <text x="66" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Medi<tspan fill="#34d399">vyx</tspan></text>
  <text x="67" y="48.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="#6ee7b7">PHARMACY</text>
</svg>
