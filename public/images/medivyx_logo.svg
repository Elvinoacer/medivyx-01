<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="medivyx-badge-grad" x1="6" y1="6" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="medivyx-shadow" x="2" y="4" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Badge -->
  <g filter="url(#medivyx-shadow)">
    <rect x="6" y="6" width="48" height="48" rx="14" fill="url(#medivyx-badge-grad)" />
    <rect x="6.5" y="6.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  </g>

  <!-- Medical Cross & Pulse Center -->
  <rect x="26" y="15" width="8" height="30" rx="4" fill="#ffffff" />
  <rect x="15" y="26" width="30" height="8" rx="4" fill="#ffffff" />
  <circle cx="30" cy="30" r="4.5" fill="#0f766e" />
  <circle cx="30" cy="30" r="2" fill="#34d399" />

  <!-- Typography -->
  <text x="66" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5" fill="#0f2922">Medi<tspan fill="#059669">vyx</tspan></text>
  <text x="67" y="48.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="#0f766e">PHARMACY</text>
</svg>
